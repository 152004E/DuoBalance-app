# Nginx config for DuoBalance API
# Ubicar en: /etc/nginx/sites-available/duobalance
#
# Pasos:
#   sudo cp nginx.conf /etc/nginx/sites-available/duobalance
#   sudo ln -s /etc/nginx/sites-available/duobalance /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d api-duobalance.duckdns.org

server {
    listen 80;
    server_name api-duobalance.duckdns.org;

    # Límite de uploads: comprobantes de gastos (5MB) + margen
    client_max_body_size 6m;

    # Logs
    access_log /var/log/nginx/duobalance-api.access.log;
    error_log /var/log/nginx/duobalance-api.error.log;

    # Health check local (sin proxy)
    location /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API principal
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket support (si se necesita en el futuro)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Headers estándar de proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Evitar cache del proxy
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Archivos estáticos (uploads: comprobantes y avatares)
    location /uploads/ {
        alias /opt/duobalance-api/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";

        # CORS para imágenes (si el frontend las carga cross-origin)
        add_header Access-Control-Allow-Origin "*";
    }
}

